[package]
name = "daov2"
version = "0.1.0"
edition = "2021"
description = "CKB DAO v2 address binding: the binding event, the checks before signing, and the DAO server's wallet API."
license = "MIT"

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde", "std"] }
hex = "0.4.3"
reqwest = { version = "0.12", features = ["blocking", "json"] }
secp256k1 = "0.30"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tracing = "0.1.44"
